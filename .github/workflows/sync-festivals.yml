name: Daily Festival Sync

on:
    schedule:
        - cron: "0 15 * * *"
    workflow_dispatch:

jobs:
    sync-festivals:
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Run festival sync
              run: npm run sync:festivals
              env:
                  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
                  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
                  TOUR_API_BASE_URL: ${{ secrets.TOUR_API_BASE_URL }}
                  TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
